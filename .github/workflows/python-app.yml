# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application (CPD Demo)

on:
  push:
    branches: [ "SRC", "main" ]
  pull_request:
    branches: [ "SRC" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install flake8 pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Install package (SRC layout)
        run: |
          pip install -e SRC

      - name: Lint (optional, non-blocking)
        run: |
          flake8 SRC --exit-zero --max-line-length=127

      - name: Run tests (if any)
        run: |
          pytest || echo "No tests yet"

      - name: Run benchmark
        run: |
          python SRC/benchmarks/runtime_benchmark.py
