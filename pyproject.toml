[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cpd-demo"
version = "0.1.0"
description = "Exploratory Computational Protein Design Demo Framework"
authors = [
  { name="Prabin Kumar" }
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["numpy"]

[tool.setuptools]
package-dir = {"" = "src"}

